<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, system-ui, sans-serif; background: #101a28; color: #ecf4ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -30%, #31516e 0, #101a28 58%); }
    main { width: min(820px, 100%); margin: 0 auto; padding: 42px 22px 68px; }
    .eyebrow { color: #8ad8df; font-size: 13px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 14px 0 10px; font-size: clamp(32px, 7vw, 48px); line-height: 1.15; letter-spacing: -.04em; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    p { color: #bfd0e5; line-height: 1.65; }
    .intro { margin: 0 0 25px; }
    .notice { margin: 22px 0; padding: 15px 17px; border: 1px solid #c69553; border-radius: 13px; color: #ffe8bf; background: #82562133; line-height: 1.6; }
    .panel { margin-top: 19px; padding: 21px; border: 1px solid #40566d; border-radius: 17px; background: #152437e8; box-shadow: 0 18px 55px #07111d55; }
    form { display: grid; gap: 13px; }
    label { display: grid; gap: 7px; color: #bfd0e5; font-size: 14px; font-weight: 700; }
    input, textarea { width: 100%; border: 1px solid #51677d; border-radius: 10px; padding: 12px 13px; color: #ecf4ff; background: #0e1927; font: inherit; }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus, button:focus-visible { outline: 2px solid #8ad8df; outline-offset: 2px; }
    button { border: 1px solid #8ad8df; border-radius: 10px; padding: 10px 14px; color: #0d2029; background: #8ad8df; font: inherit; font-weight: 800; cursor: pointer; }
    button.secondary { border-color: #5a7189; color: #d9e8f8; background: #25384d; }
    button.danger { border-color: #a45d6b; color: #ffe3e8; background: #602b37; }
    button:disabled { cursor: wait; opacity: .6; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .error { min-height: 1.4em; color: #ffabb7; }
    .status { color: #a9e7d0; overflow-wrap: anywhere; }
    .note-list { display: grid; gap: 11px; padding: 0; margin: 14px 0 0; list-style: none; }
    .note { padding: 15px 16px; border: 1px solid #40566d; border-radius: 13px; background: #1a2a3d; }
    .note strong { display: block; margin-bottom: 7px; font-size: 17px; overflow-wrap: anywhere; }
    .note p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
    .note .actions { margin-top: 13px; }
    .empty { color: #9fb4ca; padding: 12px 0; }
    [hidden] { display: none !important; }
    @media (max-width: 540px) { main { padding: 29px 16px 48px; } .panel { padding: 17px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 인증 자료실</div>
    <h1>점령된 자료실</h1>
    <p class="intro">로그인한 뒤 서버에서 가상 자료를 읽고 내 메모를 관리합니다. 실제 개인정보나 운영 자료는 입력하지 마세요.</p>
    <div class="notice">로그인은 신원 확인입니다. 지금은 메모 ID를 알면 다른 계정의 메모를 읽거나 바꿀 수 있습니다. 소유자 확인은 4단계에서 추가합니다.</div>

    <section id="login-panel" class="panel" aria-labelledby="login-heading">
      <h2 id="login-heading">로그인</h2>
      <form id="login-form">
        <label>이메일
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions"><button id="login-button" type="submit">로그인</button></div>
        <p id="login-error" class="error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="account-panel" class="panel" hidden>
      <div class="actions">
        <p id="account-label" class="status" style="margin:0; flex:1"></p>
        <button id="logout-button" class="secondary" type="button">로그아웃</button>
      </div>
      <p id="app-error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section id="workspace" hidden>
      <section class="panel" aria-labelledby="samples-heading">
        <h2 id="samples-heading">공유 가상 메모</h2>
        <ul id="samples" class="note-list" aria-live="polite"><li class="empty">로그인 후 자료를 불러옵니다.</li></ul>
      </section>

      <section class="panel" aria-labelledby="my-notes-heading">
        <h2 id="my-notes-heading">내 메모</h2>
        <ul id="my-notes" class="note-list" aria-live="polite"><li class="empty">메모를 불러오는 중입니다.</li></ul>
      </section>

      <section class="panel" aria-labelledby="editor-heading">
        <h2 id="editor-heading">새 메모</h2>
        <form id="note-form">
          <label>제목
            <input id="note-title" name="title" maxlength="200" required>
          </label>
          <label>본문
            <textarea id="note-body" name="body" maxlength="5000" required></textarea>
          </label>
          <div class="actions">
            <button id="save-button" type="submit">메모 추가</button>
            <button id="cancel-edit" class="secondary" type="button" hidden>수정 취소</button>
          </div>
          <p id="note-error" class="error" role="alert" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';

    const supabase = createClient('https://jbmdrruojvgenkxzuird.supabase.co', 'sb_publishable_QNUcGcLZWwsNjvDpdrJiYw_1h_yDcha');
    const loginPanel = document.querySelector('#login-panel');
    const accountPanel = document.querySelector('#account-panel');
    const workspace = document.querySelector('#workspace');
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const loginError = document.querySelector('#login-error');
    const accountLabel = document.querySelector('#account-label');
    const appError = document.querySelector('#app-error');
    const sampleList = document.querySelector('#samples');
    const noteList = document.querySelector('#my-notes');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteError = document.querySelector('#note-error');
    const saveButton = document.querySelector('#save-button');
    const cancelEdit = document.querySelector('#cancel-edit');
    let currentSession = null;
    let editingId = null;

    function showMessage(target, message = '') {
      target.textContent = message;
    }

    function renderRows(list, notes, editable) {
      if (!notes.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = editable ? '아직 추가한 메모가 없습니다.' : '공유 가상 메모가 없습니다.';
        list.replaceChildren(empty);
        return;
      }
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        item.className = 'note';
        const title = document.createElement('strong');
        const body = document.createElement('p');
        title.textContent = note.title;
        body.textContent = note.body;
        item.append(title, body);
        if (editable) {
          const actions = document.createElement('div');
          actions.className = 'actions';
          const edit = document.createElement('button');
          edit.className = 'secondary';
          edit.type = 'button';
          edit.textContent = '수정';
          edit.addEventListener('click', () => beginEdit(note));
          const remove = document.createElement('button');
          remove.className = 'danger';
          remove.type = 'button';
          remove.textContent = '삭제';
          remove.addEventListener('click', () => deleteNote(note.id));
          actions.append(edit, remove);
          item.append(actions);
        }
        return item;
      }));
    }

    async function api(path, options = {}) {
      const sessionResult = await supabase.auth.getSession();
      const token = sessionResult.data.session?.access_token;
      if (!token) throw new Error('로그인 세션이 없습니다. 다시 로그인해 주세요.');
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', `Bearer ${token}`);
      if (options.body) headers.set('Content-Type', 'application/json');
      const response = await fetch(path, { ...options, headers, cache: 'no-store' });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `요청 실패 (HTTP ${response.status})`);
      return data;
    }

    async function loadNotes() {
      showMessage(appError);
      const result = await api('/api/notes');
      renderRows(sampleList, result.samples || [], false);
      renderRows(noteList, result.notes || [], true);
    }

    function resetEditor() {
      editingId = null;
      noteForm.reset();
      document.querySelector('#editor-heading').textContent = '새 메모';
      saveButton.textContent = '메모 추가';
      cancelEdit.hidden = true;
      showMessage(noteError);
    }

    function beginEdit(note) {
      editingId = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body;
      document.querySelector('#editor-heading').textContent = '메모 수정';
      saveButton.textContent = '변경 저장';
      cancelEdit.hidden = false;
      showMessage(noteError);
      noteTitle.focus();
    }

    async function deleteNote(id) {
      showMessage(noteError);
      try {
        await api(`/api/notes/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (editingId === id) resetEditor();
        await loadNotes();
      } catch (error) {
        showMessage(noteError, error.message);
      }
    }

    async function showSession(session) {
      const token = session?.access_token || null;
      if (token === currentSession) return;
      currentSession = token;
      loginPanel.hidden = Boolean(session);
      accountPanel.hidden = !session;
      workspace.hidden = !session;
      showMessage(loginError);
      showMessage(appError);
      if (!session) {
        accountLabel.textContent = '';
        renderRows(sampleList, [], false);
        renderRows(noteList, [], true);
        resetEditor();
        return;
      }
      accountLabel.textContent = `로그인됨 · ${session.user?.email || '계정'}`;
      try {
        await loadNotes();
      } catch (error) {
        showMessage(appError, error.message);
      }
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginButton.disabled = true;
      showMessage(loginError);
      const email = document.querySelector('#email').value.trim();
      const password = document.querySelector('#password').value;
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage(loginError, error.message);
          return;
        }
        document.querySelector('#password').value = '';
        await showSession(data.session);
      } catch (error) {
        showMessage(loginError, error.message || '로그인 요청에 실패했습니다.');
      } finally {
        loginButton.disabled = false;
      }
    });

    document.querySelector('#logout-button').addEventListener('click', async () => {
      const button = document.querySelector('#logout-button');
      button.disabled = true;
      try {
        const { error } = await supabase.auth.signOut();
        if (error) showMessage(appError, error.message);
      } catch (error) {
        showMessage(appError, error.message || '로그아웃 요청에 실패했습니다.');
      } finally {
        button.disabled = false;
      }
    });

    cancelEdit.addEventListener('click', resetEditor);
    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      saveButton.disabled = true;
      showMessage(noteError);
      const payload = { title: noteTitle.value, body: noteBody.value };
      try {
        if (editingId) {
          await api(`/api/notes/${encodeURIComponent(editingId)}`, {
            method: 'PUT', body: JSON.stringify(payload),
          });
        } else {
          await api('/api/notes', { method: 'POST', body: JSON.stringify(payload) });
        }
        resetEditor();
        await loadNotes();
      } catch (error) {
        showMessage(noteError, error.message);
      } finally {
        saveButton.disabled = false;
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      window.setTimeout(() => { void showSession(session); }, 0);
    });
    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
    if (sessionError) showMessage(loginError, sessionError.message);
    await showSession(session);
  </script>
</body>
</html>
